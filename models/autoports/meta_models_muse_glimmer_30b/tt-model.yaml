# Muse-Glimmer-30B on QB2 (2 P300 boards = 4 Blackhole ASICs), transcribed from the
# validated bring-up in this checkout: quickstart/README.md's serve line and the
# muse-glimmer_pyenv venv that served it. Single validated configuration, so a flat
# serve: block is the whole launch config.
schema: "5.1"
repo: tt-hous/muse-glimmer-30b
name: muse-glimmer-30b
# Public and ungated, ~56 GB. This immutable snapshot contains the two
# safetensors shards used for bring-up; the current default branch is
# metadata-only and is therefore not a valid serving input.
weights:
  repo: meta-models/Muse-Glimmer-30B
  revision: f84ecc3a0ea984a4c04542a84269e3d065350a6e
kind: vllm-plugin
arch: blackhole

source:
  tt_metal: /home/ttuser/dev/muse-glimmer/wt-toolcalling
  code:
    # The import closure crosses THREE packages — computed, not eyeballed: tt/ imports
    # models.common.* AND models.tt_transformers.tt.model_config. Dir-level entries are
    # PROVEN: this exact list built and passed in-image verify (2026-08-23).
    - models/common
    - models/tt_transformers
    - models/autoports/meta_models_muse_glimmer_30b/tt
    # The model dir root is NOT listed: it carries readiness_* artifacts, .refpt
    # reference tensors, a docker/ bring-up flow, and ~556 MB under doc/ — only the one
    # load-bearing config subdir ships (doc/context_contract.json is mentioned in a log
    # string only; nothing reads it at runtime):
    - models/autoports/meta_models_muse_glimmer_30b/doc/datatype_sweep
  ubuntu: "22.04"
  python: "3.12"   # matches the validated venv; required for the seeded lock below

runtime:
  vllm: {version: "0.24.0"}
  # A local checkout, because the pushed ref cannot serve this model's headline
  # feature. 106744c0 carries the MuseGlimmer architecture registration and the
  # fabric_packet_payload_bytes setting required before mesh creation, but it
  # predates `supports_prefix_caching_with_sliding_window` -- so a container built
  # from it logs "Automatic prefix caching is disabled" and the resumed-prefill path
  # in tt/ is dead code. Verified: a build on the pushed ref reported exactly that.
  #
  # wt-plugin-apc is a git worktree pinned at 106744c0 with ONE hunk applied, the
  # prefix-caching capability gate. It deliberately does NOT carry the unrelated
  # Qwen autoport work that is uncommitted in the host's main plugin checkout, which
  # is what the previous `ref:` pin existed to avoid; taking the hunk rather than the
  # working tree keeps that guarantee. Revert to `repo:`/`ref:` once the gate is
  # pushed.
  plugin:
    path: /home/ttuser/dev/muse-glimmer/wt-plugin-apc
  # Seeded from the validated venv (`uv pip freeze` of muse-glimmer_pyenv), minus the
  # editable tt-metal/plugin installs and vllm+empty (the build provides those), minus
  # fiftyone*/voxel51-eta (its sse-starlette<1 pin contradicts the installed 3.4.8) and
  # the CUDA-only nvidia-/cuda-/flashinfer- stack, with the local transformers wheel
  # re-pinned to its identical PyPI release. Load-bearing beyond reproducibility: the
  # closure reaches models/common/utility_functions (via tt_transformers.model_config),
  # which imports pytest at module level — a live resolve never pulls pytest in and the
  # image fails verify (and would fail serve). This exact lock passed a full container
  # build + verify on 2026-08-23.
  lock: requirements.lock

serve:
  port: 8000
  hardware: p300x2        # QB2: 2 boards x 2 ASICs = the (1,4) mesh
  mesh_device: P300x2
  max_num_seqs: 32
  block_size: 64          # the TT backend rejects vLLM's default
  max_model_len: 131072   # full advertised context — validated
  # The model's chat template emits ATEM tool-call markup (<atem:function_calls>).
  # Upstream vLLM ships a muse_glimmer parser from 0.28.0; this stack pins 0.24.0, so
  # tt/muse_glimmer_tool_parser.py is the 0.28.0 file backported (one self-registration
  # shim appended — 0.24's --tool-parser-plugin flow expects the file to register
  # itself). Parse + channel-scoping behavior verified in the validated venv; the
  # end-to-end tool-call serve is NOT yet hardware-validated.
  #
  # The paired reasoning parser moves the model's `to=self` channel out of
  # user-visible content. Without it the analysis channel IS the answer: a
  # container built from this manifest returned
  #   "to=self ... Probably 4 ... So output \"4\". No extra text."
  # as message.content, and aime25 scored 0.00 against a recorded 90.00 purely
  # because no extractor can find an answer in a wall of reasoning. Added to the
  # manifest on another branch (9cf88af) and missing here, so every container
  # built from this file was silently wrong on every scored task.
  capabilities:
    tool_parser: muse_glimmer
    reasoning_parser: muse_glimmer
  args:
    - [--tool-parser-plugin, /opt/tt-metal/models/autoports/meta_models_muse_glimmer_30b/tt/muse_glimmer_tool_parser.py]
    - [--reasoning-parser-plugin, /opt/tt-metal/models/autoports/meta_models_muse_glimmer_30b/tt/reasoning_parser.py]
  additional_config:
    tt:
      sample_on_device_mode: all
      trace_region_size: 400000000
      fabric_config: FABRIC_1D_RING
      fabric_packet_payload_bytes: 8192   # needs the plugin pin above — no env override exists
      l1_small_size: 6144
      trace_mode: decode_only

verify:
  # the silent-fallback trap: tt/precision_config.py falls back to in-code defaults
  # when this file is missing — nothing else would catch an allowlist slip
  - "import pathlib; p = pathlib.Path('/opt/tt-metal/models/autoports/meta_models_muse_glimmer_30b/doc/datatype_sweep/selected_precision_config.json'); assert p.exists(), f'{p} missing: model would silently serve with default precision'"
  - "import models.autoports.meta_models_muse_glimmer_30b.tt.generator_vllm"
  # the plugin actually registers this model. vllm is imported FIRST: with
  # vllm_tt_plugin.platform as the root import, platform.py's own `import vllm`
  # re-enters the half-initialized module via plugin activation and dies on a circular
  # current_platform — an order no real serve ever uses.
  - "import vllm; import vllm_tt_plugin.platform as p; import inspect; assert 'MuseGlimmerForConditionalGeneration' in inspect.getsource(p), 'plugin lacks the Muse-Glimmer registration'"
  # the backported ATEM tool parser ships and registers under the name the
  # capabilities block launches with
  - "import vllm; import importlib.util; s = importlib.util.spec_from_file_location('mgtp', '/opt/tt-metal/models/autoports/meta_models_muse_glimmer_30b/tt/muse_glimmer_tool_parser.py'); m = importlib.util.module_from_spec(s); s.loader.exec_module(m); from vllm.tool_parsers import ToolParserManager; assert 'muse_glimmer' in ToolParserManager.tool_parsers, 'ATEM tool parser did not register'"
  # Loaded through vLLM's own plugin loader, not importlib. ReasoningParserManager
  # registers lazily: register_module records a *module path* and imports it on
  # demand, so a file loaded as spec_from_file_location('mgrp', ...) registers an
  # entry pointing at a module named 'mgrp' that can never be imported again, and
  # the class never lands in `reasoning_parsers` at all. That check fails on a
  # parser that works perfectly. `import_reasoning_parser` + `list_registered()`
  # is what the server itself does.
  - "import vllm; from vllm.reasoning import ReasoningParserManager as RM; RM.import_reasoning_parser('/opt/tt-metal/models/autoports/meta_models_muse_glimmer_30b/tt/reasoning_parser.py'); assert 'muse_glimmer' in RM.list_registered(), 'reasoning parser did not register'; RM.get_reasoning_parser('muse_glimmer')"

card:
  quickstart: |
    Muse-Glimmer-30B (~29.6 B dense, text-only) is served as an
    OpenAI-compatible endpoint for **agentic coding**: long-context (131k)
    tool-calling work driven by a coding agent.

    On this model the first start takes about 4 minutes (weight loading + kernel
    compilation). Verify it is running correctly with tool calling:
    ```bash
    curl -s localhost:8000/v1/chat/completions -H 'Content-Type: application/json' -d '{
      "model": "meta-models/Muse-Glimmer-30B",
      "messages": [{"role": "user", "content": "What is the weather in Paris right now, in Celsius?"}],
      "tools": [{
        "type": "function",
        "function": {
          "name": "get_weather",
          "description": "Get the current weather for a city.",
          "parameters": {
            "type": "object",
            "properties": {
              "city":   {"type": "string", "description": "City name"},
              "metric": {"type": "boolean", "description": "true for Celsius"}
            },
            "required": ["city"]
          }
        }
      }],
      "tool_choice": "auto",
      "max_tokens": 256,
      "temperature": 0
    }' | python3 -c 'import sys, json; c = json.load(sys.stdin)["choices"][0]; print(c["finish_reason"], json.dumps(c["message"]["tool_calls"], indent=2))'
    ```
    A correct serve prints `tool_calls` followed by a structured `get_weather` call
    with JSON arguments (e.g. `{"city": "Paris", "metric": true}`). If the call comes
    back as prose in `message.content` with `finish_reason` `stop`, the tool-call
    parser is not active in the launch.

    ## Performance

    Release latency sweep on P300x2: one request at a time (batch 1), 512
    output tokens, input length swept to the full context. Decode rate is per
    user. Retried points show the median of three independent runs.

    | input tokens | output tokens | TTFT | TPOT | end-to-end | tokens/s/user |
    |---:|---:|---:|---:|---:|---:|
    | 128 | 512 | 69.5 ms | 23.60 ms | 12.1 s | 42.38 |
    | 1,024 | 512 | 144.6 ms | 24.99 ms | 12.9 s | 40.02 |
    | 4,096 | 512 | 454.5 ms | 26.64 ms | 14.1 s | 37.54 |
    | 8,192 | 512 | 912.8 ms | 27.86 ms | 15.1 s | 35.90 |
    | 16,384 | 512 | 2.08 s | 30.26 ms | 17.5 s | 33.05 |
    | 32,768 | 512 | 4.48 s | 35.29 ms | 22.5 s | 28.34 |
    | 65,536 | 512 | 10.17 s | 45.10 ms | 33.2 s | 22.17 |
    | 130,560 | 512 | 25.12 s | 64.76 ms | 58.2 s | 15.44 |

    The last row saturates the advertised context (130,560 + 512 = 131,072).
    Serve one request at a time: concurrency at long context is admission-limited
    by the KV cache. The release passed the bounded latency gate: 2% per metric,
    plus a 5 ms absolute TTFT allowance for short-input measurement variance.

    ## Prefix caching

    Measured with vLLM's own `prefix_repetition` benchmark, the standard dataset
    for this feature. Eight distinct 4,096-token prefixes, each reused across
    eight requests, 64 requests at concurrency 1 -- the same package served twice,
    one flag apart.

    ```
    vllm bench serve --model meta-models/Muse-Glimmer-30B \
      --dataset-name prefix_repetition \
      --prefix-repetition-prefix-len 4096 --prefix-repetition-suffix-len 128 \
      --prefix-repetition-num-prefixes 8 --prefix-repetition-output-len 32 \
      --num-prompts 64 --max-concurrency 1 --ignore-eos --seed 1234
    ```

    | metric | caching off | caching on |
    |---|---:|---:|
    | mean TTFT | 497.00 ms | 168.04 ms |
    | median TTFT | 495.82 ms | 98.18 ms |
    | p99 TTFT | 525.84 ms | 952.04 ms |
    | benchmark duration | 80.14 s | 59.14 s |
    | output throughput | 25.56 tok/s | 34.63 tok/s |
    | prefix cache hit rate | 0 | 54.7% |

    The distribution is the evidence, not the mean. With caching off every request
    pays the full 4,096-token prefill and TTFT is flat at 496/497/526. With it on
    the distribution splits: 98 ms median for the 56 requests that hit, 952 ms at
    p99 for the 8 cold prefixes.

    Note the p99 moves the wrong way, 526 ms to 952 ms. A cold prefix now compiles
    its own SDPA program for its resume offset, so the first request at any
    previously unseen offset is slower than it was. Median improves 5x; the tail
    regresses 1.8x. Workloads that reuse a small set of prefixes gain; workloads
    whose offsets keep changing may not.

    ## Evaluations

    Run through tt-inference-server's eval workflow -- its lm-eval command, venv
    and scoring -- against this package at 131,072 context. Sampling is this
    card's recipe: temperature 1.0, top_p 0.95, top_k 64.

    | task | samples | metric | score | reference |
    |---|---:|---|---:|---:|
    | `gpqa_diamond_cot_zeroshot` | 198 | exact_match, flexible-extract | 77.27 | 72.8 |
    | `ifeval` | 541 | prompt_level_strict_acc | 88.72 | 77.0 |
    | `aime25` | 30 | exact_match | not valid, see below | 94.7 |

    The GPQA reference is the GPU reference score for `openai/gpt-oss-20b`, the
    closest configured analogue. This model had no GPQA row before this run, while
    every other reasoning model of its size in the catalogue has one. The `ifeval`
    reference is an IFBench floor, not an equivalence target.

    `aime25` is not reported as a score. 18 of its 30 responses contained no
    extractable answer and one ran to 294,912 characters, while the same problems
    put to the server directly return correct boxed answers -- so the figure
    measures the eval path, not the model. 30 of the 198 GPQA responses show the
    same pathology, which makes 77.27 a lower bound rather than a point estimate.
