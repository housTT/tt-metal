card:
  description: >
    CLM-v0.1-8B (Contrastive Language Model) is a System One verifier and ranker: a frozen Qwen3-8B
    encoder with last-token pooling plus two 9.4M-parameter projection heads trained with InfoNCE.
    This package serves its System One API (typed noul / choice / score questions, free-form ranking)
    and an OpenAI-compatible embeddings endpoint on one Blackhole p150 chip.
  performance: >
    Measured on this package served on one Blackhole p150 chip (two p300c boards, four chips, qb2 box),
    default profile (accuracy policy), image a79fd98c9a89. Encoder, p50 with warm traces: one text up to 128 tokens
    57.8 ms, 256 tokens 72 ms, 512 tokens 94 ms, 1024 tokens 170 ms, 2048 tokens 322 ms; eight 128-token texts
    162 ms, eight 512-token texts 625 ms; throughput saturates near 6.3 to 6.7k tokens/s. Prefill is traced at
    128 / 256 / 512 / 1024 / 2048 tokens x batch 1 / 4 / 8. System One API: the README customer example (three
    questions, 98 tokens) 262 ms cold and 0.1 ms warm (all vectors cached); a new state against a fixed action set
    60 ms, revisited states 0.1 ms (the CLM README reports 58.1 ms cold and 28.6 / 1.7 ms for the same table on one
    RTX 4090). Fidelity vs an fp32 CPU run of the same weights: cosine 0.9991 mean / 0.9960 min on 308 texts;
    96.0 percent identical argmax on 200 Typed Decisions subset decisions served from the package (98.9 percent of
    those with a reference margin above 0.10). Zero-shot on LocalLLaMA/typed-decisions (400 cases, 2,000 decisions):
    accuracy 0.364, KL 2.05, Brier 0.63, 312 ms p50 per 5-question case; T-Rex real-time game 2 of 5 courses
    survived, 2,083 decisions per course (authors on a 4090: 5 of 5, 3,342). The p150x4 profile (four chips,
    tensor parallel) is 1.9x faster at 128 tokens (30.5 ms); the p150-fast profile (stock bfp8 policy) is 6 percent
    faster than the default at 97.3 percent decision agreement with the fp32 reference.
  limitations: >
    Encoder-only; produces scores and embeddings, never text. Inputs longer than 2048 tokens are truncated to
    their last 2048 tokens (upstream clm-serve default); the encoder itself supports 40960. Outputs are
    deterministic for identical requests, but a text embedded alongside different batch-mates can differ at the
    cosine 0.999 level (batch-variant reduction order, tt-metal issue 47238), which flips about 2 percent of
    near-tie decisions. The published README example probabilities (0.410 / 0.939 / 1.984) are not reproduced
    by the published head on any hardware; this package gives 0.816 / 0.993 / 2.000 against the CPU fp32
    reference's 0.842 / 0.988 / 2.000 for the same example.
    Zero-shot Typed Decisions accuracy is below the dataset's prior baseline on both CPU and TT; the CLM authors
    treat that benchmark as a fine-tuning target. Only the p150, p150-fast and p150x4 profiles were run; a
    two-chip 1x2 mesh does not open on this box (fabric router sync timeout). The host must set
    TT_METAL_PINNED_MEMORY_CACHE_LIMIT_BYTES=0 (the package does) because loading cached weight tensors from
    disk otherwise hangs on this tt-metal version (see the port's doc/probe/README.md).
  risks: >
    The matmul kernels use 32 of 110 cores at 128 tokens (model_config grid cap), so single-text latency is about
    2x an RTX 4090; latency-sensitive loops like the T-Rex game lose decisions. The container serves one model
    process; concurrent requests are serialized on the device.
  usage: |
    The server speaks the CLM System One wire format. `POST /v1/systemone` takes `{"state": ..., "questions": {id: {"type": "noul"|"choice"|"score", "instructions": ..., "criteria": ...}}, "temperature": 1.0}`
    and returns per-question probability distributions; `POST /v1/rank` takes `{"context", "question", "answers": [...]}`;
    `POST /v1/embeddings` is OpenAI-compatible (model `qwen3-8b`, 4096-d L2-normalized, last-token pooled Qwen3-8B).
    Every response carries `X-CLM-Latency-Ms`. The playground UI is served at `/`. The `clm` Python client from
    github.com/Contrastive-LM/CLM works unchanged with `CLM_BASE_URL=http://<host>:<port>`.
  architecture: Qwen3-8B encoder (36 layers, last-token pooling) + 2 x MLP heads (4096-1536-1536-512)
  status: Experimental community bring-up
  intended_use: Zero-shot action selection, best-of-N ranking, typed decisions over text states.
  out_of_scope_use: Text generation. The package produces scores and embeddings only.
  licensing: >
    Qwen3-8B weights under Apache-2.0; CLM-v0.1-8B head weights under Apache-2.0 (Contrastive-LM);
    the vendored clm serving code under Apache-2.0; the TTNN port code under Apache-2.0.
  license:
    id: apache-2.0
  pipeline_tag: text-ranking
  base_model: [Contrastive-LM/CLM-v0.1-8B, Qwen/Qwen3-8B]
