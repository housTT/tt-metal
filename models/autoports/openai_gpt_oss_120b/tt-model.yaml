    How to read the long-context rows. Prompts above 2,048 tokens are prefilled one
    at a time, so TTFT at N users is about N times the single-user prefill (the
    last user of a wave waits for every prefill before it). vLLM admits
    148,480 tokens of context across the running requests (the plugin's 4,640 KV
    blocks are split equally between the full-attention and the sliding-window
    layer groups, and the full-attention group's 2,320 blocks of 64 tokens set
    the limit; the server logs this as "maximum concurrency 1.13x at 131,072
    tokens"): 8 sequences at 16k, 4 at 32k, 2 at 64k and one at 128k. The rest of
    a wave waits for admission (that wait lands in TTFT), and each new prompt's
    prefill stalls the decode steps of the users already generating, which is why
    per-user decode drops sharply past those counts (16k at 16 users, 32k at 8,
    64k at 4). The 130,816-token rows are the context boundary (max_model_len -
    256): only one such sequence fits, so the server handles those requests
    strictly one at a time (30.3 s prefill, then 5.1 s of decode at 20 ms per
    token). The decode column stays at 50 tok/s per user at
    every concurrency there because it is the undisturbed single-sequence rate;
    the concurrency cost is entirely in TTFT (about 35 s per request ahead in the
    queue) and in the 7 tok/s total output rate.

    ### Output budget and reasoning

    gpt-oss reasons in the Harmony `analysis` channel before it answers in the
    `final` channel, and `max_tokens` covers both. The server keeps part of every
    chat completion's budget for the answer: `clamp(max_tokens // 8, 128, 1024)`
    tokens (256 at 2,048, 512 at 4,096). If the reasoning is still running when
    the rest of the budget is used, the server closes the analysis channel, opens
    the final channel and lets the model answer with the reserved tokens (one
    extra prefill of prompt plus reasoning, about 12 s at 64k). `content` is
    therefore not null on `finish_reason: "length"` unless the budget is below
    256 tokens. `usage.completion_tokens_details.reasoning_tokens` reports the
    reasoning tokens; `thinking_token_budget` on a request caps them. Requests
    with `n` above 1, logprobs, `ignore_eos` or a required tool call are served
    without the reserve. `VLLM_HARMONY_FINAL_RESERVE_TOKENS=-1` in the serve
    environment turns it off.

    ### Known issues

    At 130,816-token prompts with 16 or more concurrent requests, one request per
    batch receives its own prompt streamed back as generated text (one
    722,000-character chunk, no `echo` requested, usage reports 256 completion
    tokens). Not observed at 8 users or at shorter inputs. Open in the vLLM fork /
    plugin output path.

    ### Accuracy

    Evals run through the OpenAI-compatible chat API against the served model:
    `reasoning_effort` medium, greedy (`temperature` 0, `do_sample` false), 4,096
    max output tokens, seed 42, chat template applied. IFEval is the full 541-prompt
    set at 32 concurrent requests; GPQA Diamond, AIME 2025 and MMLU are subsets run
    at one request at a time.

    | eval | published | measured on P150x4 |
    | --- | ---: | ---: |
    | IFEval, prompt-level strict ([frozebench run of gpt-oss-120b](https://frozebench.com/runs/openai-mirror%2Fgpt-oss-120b__ifeval__2025-10-20T07-31-55.208086)) | 78.2% | 85.8% (464/541, stderr 1.5) |
    | IFEval, instruction-level strict | not published | 90.2% |
    | IFEval, prompt-level loose / instruction-level loose | not published | 88.9% / 92.2% |
    | GPQA Diamond, CoT zero-shot ([OpenAI model card](https://cdn.openai.com/pdf/419b6906-9da6-406c-a19d-1bb078ac7637/oai_gpt-oss_model_card.pdf)) | 80.1% | 100% on a 7-question subset |
    | AIME 2025 ([OpenAI model card](https://cdn.openai.com/pdf/419b6906-9da6-406c-a19d-1bb078ac7637/oai_gpt-oss_model_card.pdf)) | 92.5% | 86.7% on 15 problems |
    | MMLU, generative ([OpenAI model card](https://cdn.openai.com/pdf/419b6906-9da6-406c-a19d-1bb078ac7637/oai_gpt-oss_model_card.pdf)) | 85.9% | 84.7% on a 15% subset |

    Prompts of 512+ tokens use the indexed expert prefill: each expert's routed
    tokens are gathered into slabs and run through compact indexed sparse
    matmuls, with the routing and slab layout computed on the host from the
    device router logits. Prefill program shapes (expert groups and the common
    batched (users, length) pairs) are compiled at server start; the first prompt
    of a new length still pays a few seconds of program creation. Prompts longer
    than 2,048 tokens are prefilled one at a time, so TTFT for many long prompts
    arriving together is the serialized prefill queue. Prompts longer than 65,536
    tokens run the expert prefill in 64k-row chunks, which is how the full
    131,072-token context is served (the 130,816 rows above).

    P150 and P150x2 are not offered as serve profiles: the fixed resident model
    state does not fit those configurations. Production serving requires P150x4.
