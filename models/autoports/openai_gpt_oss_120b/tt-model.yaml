schema: "5.1"

repo: tt-hous/gpt-oss-120b-p150x4
name: gpt-oss-120b-p150x4
weights:
  repo: openai/gpt-oss-120b
  revision: b5c939de8f754692c1647ca79fbf85e8c1e70f8a
  ignore_patterns:
    - original/*
    - metal/*
kind: vllm-plugin
arch: blackhole

image:
  registry: hf

source:
  tt_metal: /home/ttuser/dev/gpt-oss-120b/tt-metal
  code:
    - models/autoports/openai_gpt_oss_120b/__init__.py
    - models/autoports/openai_gpt_oss_120b/tt
    - models/autoports/openai_gpt_oss_120b/doc/datatype_sweep/selected_precision_config.json
    - models/autoports/openai_gpt_oss_120b/readiness_vllm/vllm_serving_capability.json
    - models/common
    - models/demos/deepseek_v3
    - models/demos/deepseek_v3_d_p
    - models/demos/gpt_oss
    - models/tt_transformers
  ubuntu: "22.04"
  python: "3.10"

runtime:
  vllm:
    wheel: /home/ttuser/dev/gpt-oss-120b/container/hf/build-inputs/vllm-0.26.0.dev4+g2bbd2a6d9-cp310-cp310-linux_x86_64.whl
  plugin:
    path: /home/ttuser/dev/gpt-oss-120b/vllm-tt-plugin
    repo: https://github.com/housTT/vllm-tt-plugin
  wheels:
    - /home/ttuser/dev/gpt-oss-120b/container/hf/build-inputs/pytest-9.0.3-py3-none-any.whl
    - /home/ttuser/dev/gpt-oss-120b/container/hf/build-inputs/torch-2.11.0+cpu-cp310-cp310-manylinux_2_28_x86_64.whl
    - /home/ttuser/dev/gpt-oss-120b/container/hf/build-inputs/transformers-5.12.1-py3-none-any.whl

serve:
  hardware: p150x4
  mesh_device: P150x4
  port: 8000
  max_num_seqs: 32
  block_size: 64
  max_model_len: 131072
  capabilities:
    tool_parser: openai
  additional_config:
    tt:
      sample_on_device_mode: all
      trace_region_size: 750000000
      fabric_config: FABRIC_1D_RING
      chunked_prefill_decode_steps: 8
  env:
    GPT_OSS_120B_FULL_MODEL_TENSOR_CACHE: /cache/model/full
    GPT_OSS_120B_SNAPSHOT: /hf/hub/models--openai--gpt-oss-120b/snapshots/b5c939de8f754692c1647ca79fbf85e8c1e70f8a
    GPT_OSS_120B_TENSOR_CACHE: /cache/model/decoder
    GPT_OSS_120B_SLIDING_RING: "1"
    GPT_OSS_120B_KV_POOL_BLOCKS: "4640"
    GPT_OSS_120B_PREFIX_CACHING: "1"
    GPT_OSS_120B_CHUNK_WARMUP: "8192"
    GPT_OSS_120B_BATCHED_PREFILL_WARMUP: "128,1024,2048"
    TTNN_CONFIG_OVERRIDES: '{"cache_path":"/cache/ttnn/cache","model_cache_path":"/cache/ttnn/models","tmp_dir":"/cache/ttnn/tmp"}'
    TORCHDYNAMO_DISABLE: "1"
    # tt-metal's shared-memory stats tracker (for tt-smi) walks every cached
    # program on each untraced op; with the indexed prefill's program set it
    # made long prompts 30x slower after a few hundred requests.
    TT_METAL_SHM_TRACKING_DISABLED: "1"
    VLLM_RPC_TIMEOUT: "900000"
    VLLM_SYSTEM_START_DATE: "2026-08-31"
    # Final-channel reserve for chat completions: 0 = automatic
    # (clamp(max_tokens // 8, 128, 1024) tokens kept for the answer), -1 = off.
    VLLM_HARMONY_FINAL_RESERVE_TOKENS: "0"
  args:
    - --async-scheduling
    - --disable-log-stats
    - --structured-outputs-config
    - '{"reasoning_parser":"openai_gptoss","enable_in_reasoning":false}'

verify:
  - "from pathlib import Path; p = Path('/opt/tt-metal/models/autoports/openai_gpt_oss_120b/doc/datatype_sweep/selected_precision_config.json'); assert p.is_file(), 'the validated precision policy is missing'"
  - "from models.autoports.openai_gpt_oss_120b.tt.generator_vllm import TTGptOssForCausalLM; assert TTGptOssForCausalLM"
  - "from importlib.metadata import version; assert version('torch') == '2.11.0+cpu'; assert version('transformers') == '5.12.1'"

card:
  quickstart: |
    This package serves `openai/gpt-oss-120b` with official vLLM and the
    Tenstorrent vLLM plugin on four P150 boards. Follow startup until the API is ready:

    ```bash
    tt-model serve tt-hous/gpt-oss-120b-p150x4 --follow
    ```

    The first start compiles kernels and model tensors into the persistent package
    cache and takes about 18 minutes; a restart with a warm cache takes about 8
    minutes.

    ### Source

    Every line of code in this image is on a public branch; the Provenance table at
    the end of this card links the exact commits the image was built from.

    - tt-metal: [`hous/gpt-oss-120b-p150x4`](https://github.com/housTT/tt-metal/tree/hous/gpt-oss-120b-p150x4)
      on the housTT fork: the GPT-OSS 120B autoport (batched decode, batched and
      indexed MoE prefill, chunked 131k prefill, sharded decode norms), the
      `ttnn.sparse_matmul` extensions it uses (fused per-group bias, optional
      second in0 sender, two-block synchronisation), the allocator tracker fix, and
      this card.
    - vLLM: [`tt/gpt-oss-serving`](https://github.com/housTT/vllm/tree/tt/gpt-oss-serving)
      on the housTT fork, commit
      [`2bbd2a6d9`](https://github.com/housTT/vllm/commit/2bbd2a6d9):
      upstream vLLM plus three Harmony changes. The parser recovers from an
      off-grammar token mid-stream (the parsed reasoning is kept, the remaining
      text is returned as `content`, a warning names the token) instead of failing
      the request. Chat completions keep a final-channel reserve so that an answer
      is returned when the reasoning uses the output budget (see Output budget and
      reasoning), and the reserve completes the final-channel header when the
      reasoning budget runs out inside it. The image installs the wheel
      `vllm-0.26.0.dev4+g2bbd2a6d9` built from that commit with
      `VLLM_TARGET_DEVICE=empty`; the Tenstorrent plugin supplies the platform.
    - vllm-tt-plugin: [`hous/gpt-oss-120b-serving`](https://github.com/housTT/vllm-tt-plugin/tree/hous/gpt-oss-120b-serving)
      on the housTT fork, commit
      [`176a8c5`](https://github.com/housTT/vllm-tt-plugin/commit/176a8c5865d9abe82d2d8a04a25b5920e78f3fcb):
      the plugin with capability-gated tensor sampling parameters and host-state
      versions for decode, which this autoport uses.

    ### Output budget and reasoning

    gpt-oss reasons in the Harmony `analysis` channel before it answers in the
    `final` channel, and `max_tokens` covers both. The server keeps part of every
    chat completion's budget for the answer: `clamp(max_tokens // 8, 128, 1024)`
    tokens (256 at 2,048, 512 at 4,096). If the reasoning is still running when
    the rest of the budget is used, the server closes the analysis channel, opens
    the final channel and lets the model answer with the reserved tokens (one
    extra prefill of prompt plus reasoning, which the prefix cache reduces to
    one 4,096-token chunk, about 1 s at 64k). If the reasoning
    ends within a few tokens of that point, so the cut falls inside the header of
    the final message, the server completes the header and the answer follows
    (before 2026 Sep 29 such a request returned the raw header text). `content` is
    therefore not null on `finish_reason: "length"` unless the budget is below
    256 tokens. `usage.completion_tokens_details.reasoning_tokens` reports the
    reasoning tokens; `thinking_token_budget` on a request caps them. Requests
    with `n` above 1, logprobs, `ignore_eos` or a required tool call are served
    without the reserve. `VLLM_HARMONY_FINAL_RESERVE_TOKENS=-1` in the serve
    environment turns it off.
  performance: |
    Latency and accuracy below are measured on this package as served by
    `tt-model serve`, not extrapolated. Latency: 2026 Sep 30 sweep. Accuracy:
    published-eval runs of 2026 Sep 24 to 26 and release-workflow runs of
    2026 Sep 21 to 22.

    ### Measured P150x4 latency (2026-09-30)

    Measured on this package by the bench-sweeps harness (`tt-model serve` from a
    cold start): random-token prompts of exactly ISL tokens, `ignore_eos`, output
    pinned to OSL tokens, Users concurrent requests held open as a closed loop, N
    requests per row in total (4 per user up to 4,096 input tokens, 2 per user at
    16,384, then 1 per user). TTFT is the time to the first streamed token;
    TPOT = (E2EL - TTFT) / (OSL - 1) per request; prefill tok/s/u = ISL / TTFT;
    decode tok/s/u = 1 / TPOT; E2EL is the end-to-end latency of one request; Out
    tok/s total is the total output tokens per second across all users over the
    row's wall time. Every value is the mean over the row's N requests. Decode
    runs one grouped expert pass per step with trace buckets at 1, 4, 8 and 32
    users; new requests that arrive in the same scheduler step and share a padded
    prompt length (up to 2,048 tokens) are prefilled together; longer prompts are
    prefilled in steps of up to 8,192 tokens with 8 decode steps for the running
    users between the chunks of one prompt; the expert gate/up bias is fused into
    the indexed sparse matmul. Prefix caching is on, but the random prompts of
    this sweep never hit it, so every row is an uncached cost.

