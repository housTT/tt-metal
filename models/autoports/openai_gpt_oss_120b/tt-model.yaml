schema: "5.1"

repo: tt-hous/gpt-oss-120b-p150x4
name: gpt-oss-120b-p150x4
weights:
  repo: openai/gpt-oss-120b
  revision: b5c939de8f754692c1647ca79fbf85e8c1e70f8a
  ignore_patterns:
    - original/*
    - metal/*
kind: vllm-plugin
arch: blackhole

image:
  registry: hf

source:
  tt_metal: /home/ttuser/dev/gpt-oss-120b/tt-metal
  code:
    - models/autoports/openai_gpt_oss_120b/__init__.py
    - models/autoports/openai_gpt_oss_120b/tt
    - models/autoports/openai_gpt_oss_120b/doc/datatype_sweep/selected_precision_config.json
    - models/autoports/openai_gpt_oss_120b/readiness_vllm/vllm_serving_capability.json
    - models/common
    - models/demos/deepseek_v3
    - models/demos/deepseek_v3_d_p
    - models/demos/gpt_oss
    - models/tt_transformers
  ubuntu: "22.04"
  python: "3.10"

runtime:
  vllm:
    wheel: /home/ttuser/dev/gpt-oss-120b/container/hf/build-inputs/vllm-0.26.0.dev1+g54dea57d9-cp310-cp310-linux_x86_64.whl
  plugin:
    path: /home/ttuser/dev/gpt-oss-120b/vllm-tt-plugin
  wheels:
    - /home/ttuser/dev/gpt-oss-120b/container/hf/build-inputs/pytest-9.0.3-py3-none-any.whl
    - /home/ttuser/dev/gpt-oss-120b/container/hf/build-inputs/torch-2.11.0+cpu-cp310-cp310-manylinux_2_28_x86_64.whl
    - /home/ttuser/dev/gpt-oss-120b/container/hf/build-inputs/transformers-5.12.1-py3-none-any.whl

serve:
  hardware: p150x4
  mesh_device: P150x4
  port: 8000
  max_num_seqs: 32
  block_size: 64
  max_model_len: 131072
  capabilities:
    tool_parser: openai
  additional_config:
    tt:
      sample_on_device_mode: all
      trace_region_size: 750000000
      fabric_config: FABRIC_1D_RING
  env:
    GPT_OSS_120B_FULL_MODEL_TENSOR_CACHE: /cache/model/full
    GPT_OSS_120B_SNAPSHOT: /hf/hub/models--openai--gpt-oss-120b/snapshots/b5c939de8f754692c1647ca79fbf85e8c1e70f8a
    GPT_OSS_120B_TENSOR_CACHE: /cache/model/decoder
    TTNN_CONFIG_OVERRIDES: '{"cache_path":"/cache/ttnn/cache","model_cache_path":"/cache/ttnn/models","tmp_dir":"/cache/ttnn/tmp"}'
    TORCHDYNAMO_DISABLE: "1"
    # tt-metal's shared-memory stats tracker (for tt-smi) walks every cached
    # program on each untraced op; with the indexed prefill's program set it
    # made long prompts 30x slower after a few hundred requests.
    TT_METAL_SHM_TRACKING_DISABLED: "1"
    VLLM_RPC_TIMEOUT: "900000"
    VLLM_SYSTEM_START_DATE: "2026-08-31"
  args:
    - --async-scheduling
    - --disable-log-stats
    - --structured-outputs-config
    - '{"reasoning_parser":"openai_gptoss","enable_in_reasoning":false}'

verify:
  - "from pathlib import Path; p = Path('/opt/tt-metal/models/autoports/openai_gpt_oss_120b/doc/datatype_sweep/selected_precision_config.json'); assert p.is_file(), 'the validated precision policy is missing'"
  - "from models.autoports.openai_gpt_oss_120b.tt.generator_vllm import TTGptOssForCausalLM; assert TTGptOssForCausalLM"
  - "from importlib.metadata import version; assert version('torch') == '2.11.0+cpu'; assert version('transformers') == '5.12.1'"

card:
  quickstart: |
    This package serves `openai/gpt-oss-120b` with official vLLM and the
    Tenstorrent vLLM plugin on four P150 boards. Follow startup until the API is ready:

    ```bash
    tt-model serve tt-hous/gpt-oss-120b-p150x4 --follow
    ```

    The first start compiles kernels and model tensors into the persistent package
    cache. The previously validated cold start took 14m25s; a warm restart took 6m50s.

    ### Measured P150x4 latency (sweep v23, 2026-09-17: batched decode, batched indexed prefill with the fused expert bias, sharded 32-row norms)

    Measured on this package by the bench-sweeps harness (`/home/ttuser/dev/bench-sweeps`,
    `tt-model serve` from a cold start): random-token prompts of exactly the input
    length, `ignore_eos`, output pinned to the output length, N = 4 x users prompts
    per row up to 4,096 input tokens and 2 x users at 16,384, then one per user.
    Decode runs one grouped expert pass per step with trace buckets at 1, 4, 8, 16
    and 32 users; new requests that arrive in the same scheduler step and share a
    padded prompt length (up to 2,048 tokens) are prefilled together; the expert
    gate/up bias is fused into the indexed sparse matmul. Aggregate is the
    harness's total output tokens per second across users.

    | input | output | users | TTFT | TPOT | decode tok/s/user | aggregate tok/s |
    | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
    | 128 | 128 | 1 | 0.25 s | 15.3 ms | 65 | 58 |
    | 128 | 128 | 8 | 0.56 s | 32.6 ms | 31 | 217 |
    | 128 | 128 | 32 | 0.99 s | 50.0 ms | 20 | 558 |
    | 1,024 | 256 | 8 | 1.60 s | 32.9 ms | 30 | 205 |
    | 1,024 | 256 | 16 | 2.68 s | 42.7 ms | 23 | 302 |
    | 1,024 | 256 | 32 | 5.10 s | 50.3 ms | 20 | 457 |
    | 4,096 | 256 | 1 | 0.82 s | 15.7 ms | 64 | 53 |
    | 4,096 | 256 | 8 | 5.9 s | 33.4 ms | 30 | 142 |
    | 4,096 | 256 | 16 | 11.5 s | 43.3 ms | 23 | 182 |
    | 4,096 | 256 | 32 | 22.9 s | 50.4 ms | 20 | 229 |
    | 16,384 | 256 | 1 | 2.5 s | 16.1 ms | 62 | 39 |
    | 32,768 | 256 | 1 | 5.2 s | 16.7 ms | 60 | 27 |
    | 65,536 | 256 | 1 | 11.9 s | 17.8 ms | 56 | 16 |
    | 130,816 | 16 | 1 | 30.8 s | 14.6 ms | 68 | 1 |

    The 130,816-token row is from the local server on the 2026-09-16 build (the
    harness does not plan a row with input + 256 > max_model_len).

    ### Accuracy

    Evals run through the OpenAI-compatible chat API against the served model with
    the release generation policy: `reasoning_effort` medium, greedy (`temperature`
    0, `do_sample` false), 4,096 max output tokens, seed 42, chat template applied.
    The IFEval row on this build was measured at 32 concurrent requests so the
    batched prefill and decode paths are the ones scored; 14 of the 541 answers
    were empty because the reasoning channel used the whole 4,096-token budget
    (the release policy has the same cap, so the runs are comparable).

    | eval | scope | score | published | release minimum | build, date |
    | --- | --- | ---: | ---: | ---: | --- |
    | IFEval (google/IFEval), prompt-level strict | 541 prompts, 32 concurrent | 85.2% (461/541, stderr 1.5) | 78.2% | 74.29% | this code (`bbe275d0`), 2026-09-17 |
    | IFEval, instruction-level strict | same run | 89.0% | | | this code, 2026-09-17 |
    | IFEval, prompt-level loose / instruction-level loose | same run | 88.2% / 90.9% | | | this code, 2026-09-17 |
    | IFEval, prompt-level strict (release run) | 541 prompts, 1 concurrent | 85.6% (463/541) | 78.2% | 74.29% | release build, 2026-09-03 |
    | GPQA Diamond, CoT zero-shot (exact match, flexible extract) | 7 of 198 questions | 100% (7/7) | | | release build, 2026-09-03 |
    | AIME 2025 | 15 problems | 86.7% | | | release build, 2026-09-02 |
    | MMLU, generative | 15% subset | 84.7% | | | release build, 2026-09-02 |

    The release build is the 2026-09-02 bring-up of this autoport (before batched
    prefill, batched decode and the indexed expert prefill); the 2026-09-17 IFEval
    run shows those changes leave the score unchanged within noise. GPQA, AIME and
    MMLU were release-readiness subsets, not full-set runs.

    Prompts of 512+ tokens use the indexed expert prefill: each expert's routed
    tokens are gathered into slabs and run through compact indexed sparse
    matmuls, with the routing and slab layout computed on the host from the
    device router logits. Prefill program shapes (expert groups and the common
    batched (users, length) pairs) are compiled at server start; the first prompt
    of a new length still pays a few seconds of program creation. Prompts longer
    than 2,048 tokens are prefilled one at a time, so TTFT for many long prompts
    arriving together is the serialized prefill queue. Prompts longer than 65,536
    tokens run the expert prefill in 64k-row chunks: the full 131,072-token
    context is served (the 130,816 row above), where an earlier build of the
    indexed prefill ran out of device DRAM.

    P150 and P150x2 are not offered as serve profiles: the fixed resident model
    state does not fit those configurations. Production serving requires P150x4.
