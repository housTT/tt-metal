    A burst of long prompts finishes 5 to 12% sooner than with the default
    profile from 16k up (16k at 16 users 111 s against 122 s, 32k at 8 users
    50 s against 58 s, 64k at 4 users 53 s against 60 s), and a single long
    prompt prefills in fewer steps (64k 11.6 s against 12.4 s). In exchange the
    other users receive no tokens while a long prompt prefills (a 64k prefill
    is a 12 s pause) and a user's first token waits for its whole prefill step.

    ### Accuracy

    Evals run through the OpenAI-compatible chat API against the served model:
    `reasoning_effort` high, one sample per item, `temperature` 1.0, `top_p` 1.0,
    `top_k` 32, chat template applied; output budgets 65,536 tokens for GPQA
    Diamond and AIME, 32,768 for HLE, 8,192 for MMLU and MMMLU. IFEval:
    `reasoning_effort` medium, greedy, 4,096 tokens, full set at 32 concurrent
    requests. Published numbers are the
    [OpenAI model card](https://cdn.openai.com/pdf/419b6906-9da6-406c-a19d-1bb078ac7637/oai_gpt-oss_model_card.pdf)
    at reasoning effort high without tools unless noted.

    | eval | published | measured on P150x4 |
    | --- | ---: | ---: |
    | GPQA Diamond, 198 questions, CoT zero-shot, boxed-letter extraction | 80.1% | 78.3% (155/198) |
    | AIME 2025, 30 problems | 92.5% | 90.0% (27/30) |
    | AIME 2024, 30 problems | 95.8% | 90.0% (27/30) |
    | MMLU, generative, 25% of each subject (3,529 questions) | 90.0% | 85.3% |
    | MMMLU, 14 languages, 5% of each (9,842 questions) | 81.3% | 82.2% |
    | HLE, 500 text-only questions, official judge prompt with gpt-oss-120b as judge (published: o3-mini judge) | 14.9% | 13.2% (66/500) |
    | SWE-bench Verified, first 50 instances by id, mini-swe-agent (published: 500 instances, OpenAI scaffold) | 62.4% | 50.0% (25/50; tool-calling scaffold 20/50, the 23 instances it left without a patch re-run with XML text actions: 13 patches, 5 resolved) |
    | IFEval, prompt-level strict ([frozebench run of gpt-oss-120b](https://frozebench.com/runs/openai-mirror%2Fgpt-oss-120b__ifeval__2025-10-20T07-31-55.208086)) | 78.2% | 85.8% (464/541, stderr 1.5) |
    | IFEval, instruction-level strict | not published | 90.2% |
    | IFEval, prompt-level loose / instruction-level loose | not published | 88.9% / 92.2% |

    Sampling at concurrency above 1 does not reproduce token for token, so
    differences of a point or two between runs of the same eval are noise.

    #### tt-inference-server release evals (full sets)

    The accuracy workflow tt-inference-server uses to certify a release
    (`run.py --model openai/gpt-oss-120b --workflow evals`, lm-evaluation-harness
    over chat completions, `temperature` 1.0, seed 42, AIME 2025 and GPQA Diamond
    at `reasoning_effort` high with 122,880 max output tokens, MMLU at low with
    65,536), run against this package and compared with the P300X2 build released
    in tt-inference-server v0.17.0.

    | eval (full set) | this package | released v0.17.0 build | published |
    | --- | ---: | ---: | ---: |
    | AIME 2025, 30 problems (`exact_match`) | 76.67% (23/30) | 76.67% | 92.5% |
    | GPQA Diamond, CoT zero-shot, 198 questions (`exact_match`, flexible-extract) | 71.72% (142/198) | 71.21% | 80.1% |
    | MMLU, generative, 14,042 questions (`exact_match`, get_response) | 86.06% (12,084/14,042) | 85.89% | 85.9% |

    Released-build numbers are the full-set runs in
    [tt-inference-server issue #3105](https://github.com/tenstorrent/tt-inference-server/issues/3105).
    On both builds the AIME and GPQA misses are mostly answers left empty because
    the reasoning used the whole output budget.
  limitations: |
    - Hardware. Four P150 chips (two p300c boards or four P150 boards). P150 and
      P150x2 are not offered: the resident model state does not fit.
    - Capacity. Up to 17 sequences of 16k tokens, 8 of 32k, 4 of 64k or 2 of 128k
      are resident at once; further requests wait, and the wait lands in time to
      first token. Prompts above 2,048 tokens are prefilled one at a time, and
      the first prompt of a new length pays a few seconds of program creation.
      9 to 16 concurrent requests decode in the 32-row batch (about 50 to 58 ms
      per token instead of 42).
    - Sampling parameters. One request with `min_p`, `logit_bias`, `bad_words`,
      `allowed_token_ids`, `min_tokens`, structured output, any `logprobs`, or a
      non-zero `temperature` with `top_k` above 32 or unrestricted moves the
      whole batch to host sampling and slows decode for every user until it
      finishes. `temperature` 0, or `top_k` 32 or lower, stays on the device.
    - Output budget. `max_tokens` covers reasoning and answer. The reserve keeps
      an answer, but a hard problem under a small budget gets a short, forced
      one; requests with `n` above 1, logprobs, `ignore_eos` or a required tool
      call have no reserve and can return null `content` on
      `finish_reason: "length"`.
    - Heavy long-context load. With 8 or more concurrent requests at 16k tokens
      and up, one request per batch has occasionally received its own prompt
      streamed back as generated text (one chunk of up to 725,000 characters);
      clients should tolerate an oversized first chunk. Under sustained 32-user
      load with 122,880-token budgets the plugin has also failed to allocate a
      device slot (`no free device state slot`); submitting such work in fixed
      batches of 32 avoided it. Both are open.
    - Tools. No built-in Python or browser tool, so OpenAI's "with tools" results
      do not apply. Function calling uses the OpenAI tool format; a malformed
      tool-call JSON from the model is passed through verbatim and an empty final
      message ends with `finish_reason: "stop"`, so agent scaffolds need a retry
      for both.
