    How to read the long-context rows. vLLM admits 296,960 tokens of context
    across the running requests (the plugin's 4,640 KV blocks of 64 tokens all
    serve the 18 full-attention layers, and the 18 sliding-window layers keep a
    768-token ring per sequence outside that pool; the server logs this as
    "maximum concurrency 2.27x at 131,072 tokens"): 17 sequences at 16k, 8 at 32k,
    4 at 64k and 2 at 128k. Prompts are prefilled one at a time in steps of up to
    8,192 tokens (two 4,096-token prompts per step, one 8,192-token chunk of a
    longer prompt), and after every chunk of a long prompt the scheduler runs 8
    decode steps for the users already generating, so a running user keeps
    receiving tokens during another user's long prefill (about 4 tokens per
    second each while a 64k prompt is prefilled, instead of a stall for the whole
    prefill). In these rows every user's prompt arrives at once and each user
    then decodes 256 tokens, so TTFT is the time to a user's own prefill step and
    the time between TTFT and E2EL includes the wait behind the other users'
    prefill steps and chunks: the TPOT and decode columns understate the
    decode-step rate (about 50 ms per token in the 32-row bucket) whenever
    prompts are still being prefilled. Against prefill-first scheduling (the
    2026 Sep 17 sweep of the previous build), mean TTFT is lower at every user
    count up to the admission limit (16k at 8 users 9.4 s, was 19.4 s; 32k at 4
    users 15.7 s, was 20.8 s; 64k at 2 users 19.8 s, was 23.8 s), the mean E2EL
    is 4 to 28% higher on the multi-user rows from 16k up because the admitted
    requests now finish together instead of one after another (128k at 2 users:
    both finish at about 68 s, where before one finished at 35 s and the other at
    71 s), and the time to finish the whole burst is unchanged at 64k and 128k
    (128k at 2 users 70 s, was 71 s; 128k at 8 users 279 s, was 285 s) and 7 to
    22% longer at 16k and 32k (16k at 16 users 122 s, was 102 s), where the
    chunked prefill of a 16k or 32k prompt costs 4 to 9% more than one
    uninterrupted prefill and 16 or more users decode in the 32-row bucket. The
    decode steps between chunks are not that cost: with
    `additional_config.tt.chunked_prefill_decode_steps: 0` in `serve.args`
    (prefill-first scheduling, measured on the same build) the E2EL of these
    rows is the same within noise (16k at 8 users 30.0 s vs 30.3 s; 64k at 4
    users 56.1 s vs 58.3 s; 128k at 2 users 68.4 s both) or worse (16k at 32
    users 117 s vs 112 s), and first tokens come later (16k at 8 users 13.1 s vs
    9.4 s; 16k at 32 users 75 s vs 59 s) while a long prompt's prefill stalls the
    running users. The 130,816-token rows are the context boundary (max_model_len -
    256): two such sequences fit, so at 2 users both run together (47 s mean
    TTFT), and from 4 users on the rest wait for admission, about 35 s per
    request ahead in the queue. 16 users decode in the 32-row bucket (about 50
    to 58 ms per token at short context) because the 16-row bucket is off (see
    Limitations).

    Prompts of 512+ tokens use the indexed expert prefill: each expert's routed
    tokens are gathered into slabs and run through compact indexed sparse
    matmuls, with the routing and slab layout computed on the host from the
    device router logits. Prefill program shapes (expert groups and the common
    batched (users, length) pairs) are compiled at server start; the first prompt
    of a new length still pays a few seconds of program creation. Prompts longer
    than 2,048 tokens are prefilled one at a time, so TTFT for many long prompts
    arriving together is the prefill queue with decode steps interleaved. Prompts
    longer than 8,192 tokens reach the model in 8,192-token chunks, so the full
    131,072-token context is served as 16 chunks (the 130,816 rows above).

    ### Accuracy

    Evals run through the OpenAI-compatible chat API against the served model with
    the settings that score best on gpt-oss: `reasoning_effort` high, one sample per
    item, `temperature` 1.0, `top_p` 1.0, `top_k` 32 (top-k 32 keeps sampling on the
    device sampler), chat template applied. Output budgets: 65,536 tokens for GPQA
    Diamond and AIME, 32,768 for HLE, 8,192 for MMLU and MMMLU; the final-channel
    reserve returns an answer when the reasoning reaches the budget. IFEval uses the
    release policy: `reasoning_effort` medium, greedy, 4,096 tokens, full set at 32
    concurrent requests. Published numbers are the
    [OpenAI model card](https://cdn.openai.com/pdf/419b6906-9da6-406c-a19d-1bb078ac7637/oai_gpt-oss_model_card.pdf)
    at reasoning effort high, no tools, unless noted.

    | eval | published | measured on P150x4 |
    | --- | ---: | ---: |
    | GPQA Diamond, 198 questions, CoT zero-shot, boxed-letter extraction | 80.1% | 78.3% (155/198) |
    | AIME 2025, 30 problems | 92.5% | 90.0% (27/30) |
    | AIME 2024, 30 problems | 95.8% | 90.0% (27/30) |
    | MMLU, generative, 25% of each subject (3,529 questions) | 90.0% | 85.3% |
    | MMMLU, 14 languages, 5% of each (9,842 questions) | 81.3% | 82.2% |
    | HLE, 500 text-only questions, official judge prompt with gpt-oss-120b as judge (published: o3-mini judge) | 14.9% | 13.2% (66/500) |
    | SWE-bench Verified, first 50 instances by id, mini-swe-agent (published: 500 instances, OpenAI scaffold) | 62.4% | 50.0% (25/50; tool-calling scaffold 20/50, the 23 instances it left without a patch re-run with XML text actions: 13 patches, 5 resolved) |
    | IFEval, prompt-level strict ([frozebench run of gpt-oss-120b](https://frozebench.com/runs/openai-mirror%2Fgpt-oss-120b__ifeval__2025-10-20T07-31-55.208086)) | 78.2% | 85.8% (464/541, stderr 1.5) |
    | IFEval, instruction-level strict | not published | 90.2% |
    | IFEval, prompt-level loose / instruction-level loose | not published | 88.9% / 92.2% |

    Sampling at concurrency above 1 does not reproduce token for token, so
    differences of a point or two between runs of the same eval are noise. The
    full comparison, with per-language MMMLU and per-category HLE results, is in
    the evals page linked from the progress report.

    #### tt-inference-server release evals (full sets, 2026-09-21/22)

    The same accuracy workflow tt-inference-server uses to certify a release
    (`run.py --model openai/gpt-oss-120b --tt-device p300x2 --workflow evals`,
    its `EVAL_CONFIGS` entry for gpt-oss-120b, lm-evaluation-harness
    `local-chat-completions`), run against this package on a QuietBox 2 (2x p300c,
    4 chips) and compared with the P300X2 build released in tt-inference-server
    v0.17.0 (tt-metal `8c48a10`, vLLM `f52987a`). Sampling is the harness's:
    `temperature` 1.0, seed 42; AIME 2025 and GPQA Diamond at `reasoning_effort`
    high with 122,880 max output tokens, MMLU at low with 65,536. Every question is
    scored once, exactly as the harness scores it.

    | eval (full set) | this package | released v0.17.0 build | published |
    | --- | ---: | ---: | ---: |
    | AIME 2025, 30 problems (`exact_match`) | 76.67% (23/30) | 76.67% | 92.5% |
    | GPQA Diamond, CoT zero-shot, 198 questions (`exact_match`, flexible-extract) | 71.72% (142/198) | 71.21% | 80.1% |
    | MMLU, generative, 14,042 questions (`exact_match`, get_response) | 86.06% (12,084/14,042) | 85.89% | 85.9% |

    Released-build numbers are the full-set runs recorded in
    [tt-inference-server issue #3105](https://github.com/tenstorrent/tt-inference-server/issues/3105);
    published numbers are the OpenAI model card (no tools). On both builds the
    AIME and GPQA misses are mostly answers left empty because the reasoning
    channel used the whole output budget (5/30 and 28/198 here; 5/30 and 10/198 on
    the released build). AIME ran at 32 concurrent requests in one harness
    invocation; MMLU at 32 in one invocation (no empty or garbled answers); GPQA
    was submitted as seven fixed batches of 32 questions at 32 concurrent requests
    so that the plugin's device-state-slot allocation failure (`no free device
    state slot ... capacity=32`, hit when requests that reach the token cap finish
    in the same step while replacements are queued) could not interrupt the run.
    Half-full batches (16 of 32 sequences) produced corrupted output on the build
    those runs used; the cause was the 16-row decode bucket, which this package no
    longer uses (see limitations).
  limitations: |
    - Hardware. P150 and P150x2 are not offered as serve profiles: the fixed
      resident model state does not fit those configurations. Production serving
      requires P150x4.
    - Long prompts. Prompts longer than 2,048 tokens are prefilled one at a
      time in 8,192-token chunks (`--max-num-batched-tokens`), and after each
      chunk the users already generating get 8 decode steps
      (`additional_config.tt.chunked_prefill_decode_steps`; 0 restores
      prefill-first scheduling). A running user therefore keeps receiving tokens
      during another user's long prefill (about 4 tokens per second each during
      a 64k prefill) instead of stalling for it, and long prompts that arrive
      together get their first token about twice as early as with prefill-first
      scheduling. The cost is throughput while many prompts are still prefilling,
      because those decode steps run at a small batch: on a burst of 8 or 16
      long prompts the mean end-to-end latency is 5 to 12% higher than with
      prefill-first scheduling (see the latency table). The first prompt of a
      new length still pays a few seconds of prefill program creation.
    - Context admission. vLLM admits 296,960 tokens of context across the running
      requests (the 18 full-attention layers are paged; the 18 sliding-window
      layers keep a 768-token ring per sequence outside the pool): 17 sequences
      at 16k, 8 at 32k, 4 at 64k and 2 at 128k. Requests beyond that wait for
      admission, and the wait lands in time to first token.
    - Decode batch buckets. Decode runs traced graphs at 1, 4, 8 and 32 rows; a
      batch of 9 to 16 running requests uses the 32-row trace. The 16-row trace
      is disabled because its decode graph corrupts some rows (an exact-output
      probe with 16 simultaneous requests returned wrong text for 8 of them, and
      requests that passed through that bucket while others joined derailed);
      `GPT_OSS_120B_DECODE_BUCKETS=4,8,16` restores it for investigation only.
    - Prefix caching. Automatic prefix caching is on (`GPT_OSS_120B_PREFIX_CACHING=0`
      or `--no-enable-prefix-caching` turns it off). A hit is counted in whole
      512-token units and resumes the prefill 2,560 tokens before the hit so that
      the sliding-window rings are exact again by the first new token, so a
      cached prefix shorter than about 5,000 tokens saves little; a repeated or
      multi-turn prompt with a longer shared prefix answers in 1 to 2 s instead
      of a full prefill (about 5 s at 24k tokens, 14 s at 64k).
    - Sampling parameters. Decode samples on the device only while every running
      request stays within the device sampler's parameter set. One request with
      `min_p`, `logit_bias`, `bad_words`, `allowed_token_ids`, `min_tokens`,
      structured output (`response_format` or guided decoding), any `logprobs`
      (device logprobs need an 8- or 32-chip mesh), or a non-zero `temperature`
      with `top_k` above 32 or unrestricted switches the whole batch to host
      sampling. Host sampling releases the decode trace and slows decode for every
      user until that request finishes. `temperature` 0 and `top_k` 32 or lower
      stay on the device. Source: `check_perform_device_sampling` in the
      vllm-tt-plugin model runner.
    - Output budget. `max_tokens` covers reasoning and answer together. The
      final-channel reserve keeps `clamp(max_tokens // 8, 128, 1024)` tokens for
      the answer, so a hard reasoning problem under a small budget gets a short,
      forced answer rather than a null one. Requests with `n` above 1, logprobs,
      `ignore_eos` or a required tool call are served without the reserve, and
      their `content` can be null on `finish_reason: "length"`.
    - Prompt echo under heavy long-context load. At 65,536-token prompts with 32
      concurrent requests and at 130,816-token prompts with 16 or more, one
      request per batch receives its own prompt streamed back as generated text
      (a single chunk of 360,000 to 725,000 characters, no `echo` requested,
      usage reports 256 completion tokens; the 2026 Sep 30 sweep saw one each at
      64k/32, 128k/16 and 128k/32). Also reproduced at 16,384- and 32,768-token
      prompts with 8 concurrent requests. Open in the vLLM fork / plugin output
      path.
    - Concurrency edge cases seen under the tt-inference-server eval workflow
      (32 concurrent requests, 122,880-token budgets): the plugin's device-state
      slot allocation can fail (`no free device state slot ... capacity=32`) when
      requests that reach the token cap finish in the same step while replacements
      are queued, and half-full batches of 16 of 32 sequences produced corrupted
      output (the 16-row decode bucket, now off; see Decode batch buckets). Those
      runs were submitted in fixed batches of 32 to avoid both; see Accuracy.
    - Tools and agent scaffolds. The served API has no built-in Python or
      browser tool, so OpenAI's "with tools" results do not apply. Function
      calling uses the OpenAI tool format (`tool_parser: openai`). With
      mini-swe-agent's tool-calling scaffold, 23 of 50 SWE-bench Verified runs
      ended on repeated format errors: of 346 rejected responses in 2,904 model
      calls, 282 were tool calls whose JSON arguments closed the command string
      with `"]` instead of `"}` (the server passes the model's invalid JSON
      through verbatim), 49 had no tool call because the command was written in
      the reasoning channel and the final message was empty, 11 named a tool that
      does not exist. With the XML text-action scaffold the same 23 instances
      produced 13 patches; the rejected responses there were mostly several
      actions in one response (203 of 291) or an empty final message with the
      action inside the reasoning channel (51). An empty final message ends
      with `finish_reason: "stop"`, so the final-channel reserve does not
      recover it.
    - Accuracy against the published numbers. Measured scores are below OpenAI's
      high-effort numbers on GPQA Diamond, AIME 2024 and 2025, MMLU and SWE-bench
      Verified, above them on MMMLU and on IFEval (whose reference is a
      third-party run), and 1.7 points below on HLE with a self-judge in place of
      the o3-mini judge; see Accuracy. Sampling at concurrency above 1 does not
      reproduce token for token, so single runs of the same eval move by a point
      or two.
    - Startup. A cold start compiles kernels and model tensors for about 18
      minutes; a warm restart takes about 8 minutes.
