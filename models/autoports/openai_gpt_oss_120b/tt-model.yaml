card:
  quickstart: |
    This package serves `openai/gpt-oss-120b` with official vLLM and the
    Tenstorrent vLLM plugin on four P150 boards. Follow startup until the API is ready:

    ```bash
    tt-model serve tt-hous/gpt-oss-120b-p150x4 --follow
    ```

    The first start compiles kernels and model tensors into the persistent package
    cache. The previously validated cold start took 14m25s; a warm restart took 6m50s.

    ### Measured P150x4 latency (sweep v24, 2026-09-17: every planned row, 1 to 32 users at every input length up to the 131,072-token context)

    Measured on this package by the bench-sweeps harness (`/home/ttuser/dev/bench-sweeps`,
    `tt-model serve` from a cold start): random-token prompts of exactly ISL tokens,
    `ignore_eos`, output pinned to OSL tokens, Users concurrent requests held open
    as a closed loop, N requests per row in total (4 per user up to 4,096 input
    tokens, 2 per user at 16,384, then 1 per user). TTFT is the time to the first
    streamed token; TPOT = (E2EL - TTFT) / (OSL - 1) per request; prefill tok/s/u =
    ISL / TTFT; decode tok/s/u = 1 / TPOT; E2EL is the end-to-end latency of one
    request; Out tok/s total is the harness's total output tokens per second across
    all users over the row's wall time. Every value is the mean over the row's N
    requests. The harness rule that used to stop multi-user rows once concurrency
    wrecked end-to-end latency is off for this table, so the long-context rows show
    the real client experience at each concurrency. Decode runs one grouped expert
    pass per step with trace buckets at 1, 4, 8, 16 and 32 users; new requests that
    arrive in the same scheduler step and share a padded prompt length (up to 2,048
    tokens) are prefilled together; the expert gate/up bias is fused into the
    indexed sparse matmul.

