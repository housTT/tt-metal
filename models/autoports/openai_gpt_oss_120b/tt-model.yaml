schema: "5.1"

repo: tt-hous/gpt-oss-120b-p150x4
name: gpt-oss-120b-p150x4
weights:
  repo: openai/gpt-oss-120b
  revision: b5c939de8f754692c1647ca79fbf85e8c1e70f8a
  ignore_patterns:
    - original/*
    - metal/*
kind: vllm-plugin
arch: blackhole

image:
  registry: hf

source:
  tt_metal: /home/ttuser/dev/gpt-oss-120b/tt-metal
  code:
    - models/autoports/openai_gpt_oss_120b/__init__.py
    - models/autoports/openai_gpt_oss_120b/tt
    - models/autoports/openai_gpt_oss_120b/doc/datatype_sweep/selected_precision_config.json
    - models/autoports/openai_gpt_oss_120b/readiness_vllm/vllm_serving_capability.json
    - models/common
    - models/demos/deepseek_v3
    - models/demos/deepseek_v3_d_p
    - models/demos/gpt_oss
    - models/tt_transformers
  ubuntu: "22.04"
  python: "3.10"

runtime:
  vllm:
    wheel: /home/ttuser/dev/gpt-oss-120b/container/hf/build-inputs/vllm-0.26.0.dev4+g2bbd2a6d9-cp310-cp310-linux_x86_64.whl
  plugin:
    path: /home/ttuser/dev/gpt-oss-120b/vllm-tt-plugin
    repo: https://github.com/housTT/vllm-tt-plugin
  wheels:
    - /home/ttuser/dev/gpt-oss-120b/container/hf/build-inputs/pytest-9.0.3-py3-none-any.whl
    - /home/ttuser/dev/gpt-oss-120b/container/hf/build-inputs/torch-2.11.0+cpu-cp310-cp310-manylinux_2_28_x86_64.whl
    - /home/ttuser/dev/gpt-oss-120b/container/hf/build-inputs/transformers-5.12.1-py3-none-any.whl

serve:
  hardware: p150x4
  mesh_device: P150x4
  port: 8000
  max_num_seqs: 32
  block_size: 64
  max_model_len: 131072
  capabilities:
    tool_parser: openai
  additional_config:
    tt:
      sample_on_device_mode: all
      trace_region_size: 750000000
      fabric_config: FABRIC_1D_RING
      chunked_prefill_decode_steps: 8
  env:
    GPT_OSS_120B_FULL_MODEL_TENSOR_CACHE: /cache/model/full
    GPT_OSS_120B_SNAPSHOT: /hf/hub/models--openai--gpt-oss-120b/snapshots/b5c939de8f754692c1647ca79fbf85e8c1e70f8a
    GPT_OSS_120B_TENSOR_CACHE: /cache/model/decoder
    GPT_OSS_120B_SLIDING_RING: "1"
    GPT_OSS_120B_KV_POOL_BLOCKS: "4640"
    GPT_OSS_120B_PREFIX_CACHING: "1"
    GPT_OSS_120B_CHUNK_WARMUP: "8192"
    GPT_OSS_120B_BATCHED_PREFILL_WARMUP: "128,1024,2048"
    TTNN_CONFIG_OVERRIDES: '{"cache_path":"/cache/ttnn/cache","model_cache_path":"/cache/ttnn/models","tmp_dir":"/cache/ttnn/tmp"}'
    TORCHDYNAMO_DISABLE: "1"
    # tt-metal's shared-memory stats tracker (for tt-smi) walks every cached
    # program on each untraced op; with the indexed prefill's program set it
    # made long prompts 30x slower after a few hundred requests.
    TT_METAL_SHM_TRACKING_DISABLED: "1"
    VLLM_RPC_TIMEOUT: "900000"
    VLLM_SYSTEM_START_DATE: "2026-08-31"
    # Final-channel reserve for chat completions: 0 = automatic
    # (clamp(max_tokens // 8, 128, 1024) tokens kept for the answer), -1 = off.
    VLLM_HARMONY_FINAL_RESERVE_TOKENS: "0"
  args:
    - --async-scheduling
    - --disable-log-stats
    - --structured-outputs-config
    - '{"reasoning_parser":"openai_gptoss","enable_in_reasoning":false}'

serve_profiles:
  - name: default
    description: >-
      Interactive and agentic traffic: chat, multi-turn, agents, RAG, mixed prompt
      lengths. Long prompts are prefilled in 8,192-token steps with 8 decode steps
      for the running users between the steps of one prompt, so every user keeps
      receiving tokens; prefix caching on.
  - name: throughput
    description: >-
      Bulk work where only the time to finish a batch counts (evals at 32 concurrent
      requests, offline summarization or classification, batch document processing):
      prefill-first scheduling in 32,768-token steps, no decode steps between the
      steps of one prompt; prefix caching on. Lower time to finish a burst of long
      prompts, no streaming during another user's long prefill.
    additional_config:
      tt:
        chunked_prefill_decode_steps: 0
    env:
      GPT_OSS_120B_CHUNK_WARMUP: "32768"
    args:
      - --max-num-batched-tokens
      - "32768"
      - --async-scheduling
      - --disable-log-stats
      - --structured-outputs-config
      - '{"reasoning_parser":"openai_gptoss","enable_in_reasoning":false}'
default_profile: default

verify:
  - "from pathlib import Path; p = Path('/opt/tt-metal/models/autoports/openai_gpt_oss_120b/doc/datatype_sweep/selected_precision_config.json'); assert p.is_file(), 'the validated precision policy is missing'"
  - "from models.autoports.openai_gpt_oss_120b.tt.generator_vllm import TTGptOssForCausalLM; assert TTGptOssForCausalLM"
  - "from importlib.metadata import version; assert version('torch') == '2.11.0+cpu'; assert version('transformers') == '5.12.1'"

card:
  quickstart: |
    `openai/gpt-oss-120b` served by vLLM and the Tenstorrent vLLM plugin on four
    P150 chips (two p300c boards or four P150 boards). Add `--follow` to the serve
    command to watch the log until the API is ready: the first start compiles
    kernels and model tensors into the package cache and takes about 18 minutes,
    later starts about 8 minutes. Then talk to it with any OpenAI client; `model`
    is the weights id:

    ```bash
    curl -s http://127.0.0.1:20000/v1/chat/completions -H 'Content-Type: application/json' -d '{
      "model": "openai/gpt-oss-120b",
      "messages": [{"role": "user", "content": "Summarize the attached report in five bullets."}],
      "max_tokens": 2048, "reasoning_effort": "medium", "stream": true}'
    ```

    ### Which profile

    | profile | use it for |
    | --- | --- |
    | `default` | interactive and agentic traffic: chat, multi-turn, agents, RAG, mixed prompt lengths. Long prompts are prefilled in 8,192-token steps and every running user keeps receiving tokens between the steps. |
    | `throughput` | bulk work where only the time to finish a batch counts: evals at 32 concurrent requests, offline summarization or classification, batch document processing. Prefill-first in 32,768-token steps; a burst of long prompts finishes 5 to 12% sooner, but nobody receives tokens while a long prompt is being prefilled. |

    ```bash
    tt-model serve tt-hous/gpt-oss-120b-p150x4 --profile throughput --follow
    ```

    Both profiles serve the full 131,072-token context, run up to 32 concurrent
    requests, admit 296,960 tokens of context across them, and cache prefixes.

    ### Reasoning and the output budget

    gpt-oss reasons before it answers, and `max_tokens` covers both. The server
    keeps `clamp(max_tokens // 8, 128, 1024)` tokens of every chat completion's
    budget for the answer, so a request that runs out of budget while reasoning
    still returns an answer (`finish_reason: "length"` with non-null `content`).
    `usage.completion_tokens_details.reasoning_tokens` reports the reasoning
    tokens; `reasoning_effort` (`low`, `medium`, `high`) sets how much the model
    reasons. Requests with `n` above 1, logprobs, `ignore_eos` or a required tool
    call are served without the reserve.

    ### Source

    Built from public branches on the housTT forks:
    [tt-metal](https://github.com/housTT/tt-metal/tree/hous/gpt-oss-120b-p150x4),
    [vLLM](https://github.com/housTT/vllm/tree/tt/gpt-oss-serving) and
    [vllm-tt-plugin](https://github.com/housTT/vllm-tt-plugin/tree/hous/gpt-oss-120b-serving);
    the Provenance table at the end links the exact commits.
  performance: |
    All numbers are measured on this package as served by `tt-model serve` on a
    QuietBox 2 (two p300c boards, four P150 chips).

    ### Latency, default profile

    Random-token prompts of exactly ISL tokens, output pinned to OSL tokens, Users
    concurrent requests held open as a closed loop, N requests per row; means over
    the row. TTFT is the time to the first streamed token, TPOT the time per
    output token after it, E2EL the end-to-end latency of one request, Out the
    total output tokens per second across all users. The random prompts never hit
    the prefix cache, so every row is an uncached cost.

