    How to read the rows: up to 17 sequences of 16k tokens, 8 of 32k, 4 of 64k
    or 2 of 128k are resident at once (296,960 tokens of context); requests
    beyond that wait for admission, and the wait lands in TTFT. Prompts above
    2,048 tokens are prefilled one at a time in steps of up to 8,192 tokens, so
    in a burst a user's TTFT is the time to its own prefill step and the time
    between TTFT and E2EL includes the wait behind the other users' steps; the
    TPOT column therefore understates the decode rate (about 50 ms per token
    at 32 users) while prompts are still being prefilled. 9 to 16 concurrent
    users decode in the 32-row batch (see Limitations).

    ### Prefix caching

    Repeated prefixes (multi-turn history, shared system prompts, agent loops)
    skip most of their prefill. Measured with `vllm bench serve`: every request
    shares a random prefix of the given length plus a 512-token unique suffix,
    64 output tokens, greedy, the first request of a row cold, caching off on the
    same server for comparison.

    | Shared prefix (tokens) | Users | N | Cached-token hit rate | TTFT median, caching off (ms) | TTFT median, caching on (ms) | Speed-up | TTFT p99 on (ms) | E2EL median off / on (s) |
    | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
    | 16,384 | 1 | 12 | 88.9% | 3,024 | 820 | 3.7x | 3,961 | 4.03 / 1.82 |
    | 32,768 | 1 | 12 | 90.3% | 6,059 | 929 | 6.5x | 6,031 | 7.09 / 1.96 |
    | 65,536 | 1 | 12 | 91.0% | 13,150 | 1,161 | 11.3x | 13,042 | 14.24 / 2.25 |
    | 32,768 | 4 | 16 | 92.3% | 20,111 | 3,803 | 5.3x | 8,539 | 35.22 / 5.32 |

    A hit re-prefills about 2,560 tokens plus the new suffix (one prefill step,
    about 1 s) at any prefix length, so the gain grows with the prefix and a
    shared prefix shorter than about 5,000 tokens saves little. The hit rate is
    the server's own `vllm:prefix_cache_hits` / `vllm:prefix_cache_queries`.

    ### Latency, throughput profile

    Same client and prompts, measured on the local server; the default profile's
