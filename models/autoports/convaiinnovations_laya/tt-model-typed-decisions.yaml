schema: "5.1"
repo: tt-hous/laya-typed-decisions-p150
name: laya-typed-decisions-p150
weights:
  repo: convaiinnovations/laya-typed-decisions
  revision: e929ae5cf69bc34259cd2f95c9e91145b818b1f0
  ignore_patterns: ["assets/*", "*.png"]
kind: tt-dit-server
arch: blackhole

image:
  registry: hf

source:
  tt_metal: /home/hous/dev/laya/worktree/tt-metal
  code:
    - models/autoports/convaiinnovations_laya/__init__.py
    - models/autoports/convaiinnovations_laya/common.py
    - models/autoports/convaiinnovations_laya/vendor
    - models/autoports/convaiinnovations_laya/tt
    - models/autoports/convaiinnovations_laya/reference
    - models/autoports/convaiinnovations_laya/server
    - models/autoports/convaiinnovations_laya/shim
    - models/autoports/convaiinnovations_laya/demo
    - models/autoports/convaiinnovations_laya/tests/__init__.py
    - models/autoports/convaiinnovations_laya/tests/pcc_utils.py
  ubuntu: "22.04"
  python: "3.12"

runtime:
  app: models.autoports.convaiinnovations_laya.server.app:app
  mesh_shape_env: LAYA_MESH_SHAPE
  packages: [transformers==5.12.1, safetensors, huggingface-hub, numpy==1.26.4]

serve:
  port: 8710
  hardware: p150
  mesh_device: P150
  env:
    LAYA_BACKEND: tt
    LAYA_REVISION: e929ae5cf69bc34259cd2f95c9e91145b818b1f0
    LAYA_PRECISION: bf8w_hifi3_erf
    LAYA_SEQ_BUCKETS: "128,256,512,1024"
    LAYA_ROW_BUCKETS: "1,2,4,5,8,10,16,32,50,64"
    LAYA_ROW_BUCKETS_1024: "1,2,4,5,8,10,16"
    LAYA_MAX_ROWS: "64"
    LAYA_MAX_BATCH_STATES: "64"
    LAYA_MAX_BATCH_TOKENS: "16384"
    LAYA_TRACE: "1"
    LAYA_TRACE_REGION_SIZE: "536870912"
    LAYA_L1_SMALL_SIZE: "79104"
    LAYA_RAW_FORWARD: "1"
    LAYA_SANITY_REFERENCE: /opt/tt-metal/models/autoports/convaiinnovations_laya/server/sanity_reference_typed_decisions.json
    TT_METAL_PINNED_MEMORY_CACHE_LIMIT_BYTES: "0"

serve_profiles:
  - name: p150
    hardware: p150
    mesh_device: P150
    description: "One Blackhole p150 chip; bf8w_hifi3_erf; 37 traces (176.8 MiB) captured before the server reports ready: 1, 2, 4, 5, 8, 10, 16, 32, 50 and 64 rows at 128, 256 and 512 tokens and 1, 2, 4, 5, 8, 10 and 16 rows at 1024 tokens; at most 16384 padded tokens per forward (16 rows at 1024 tokens, 32 at 512, 64 at 256 and 128)."
  - name: p150x4
    hardware: p150x4
    mesh_device: P150x4
    description: "1x4 mesh, data parallel over rows, no fabric; measured from the packaged image (build 2): 12.7 / 16.1 / 23.8 / 68.5 ms for 1 / 5 / 10 / 50 questions and 309 to 936 questions per second batched; parity smoke 100 of 100 decisions; a single question is slower than one chip (12.7 versus 10.8 ms) by the mesh host overhead."
default_profile: p150

verify:
  - "import models.autoports.convaiinnovations_laya.server.app as a; assert a.app"
  - "import models.autoports.convaiinnovations_laya.vendor.rl_common as c; assert c.build_sequence and c.DecisionModel"
  - "import models.autoports.convaiinnovations_laya.tt.laya_model as m; assert m.TtnnLayaModel"
  - "import models.autoports.convaiinnovations_laya.tt.engine as e; assert e.LayaEngine.from_env"
  - "import models.autoports.convaiinnovations_laya.server.decode as d; assert d.decode_answers"
  - "import models.autoports.convaiinnovations_laya.server.engine as g; assert g.Engine.from_env and g.CpuBackend"
  - "import models.autoports.convaiinnovations_laya.reference.laya_reference as r; assert r.LayaReference"
  - "from pathlib import Path; assert Path('/opt/tt-metal/models/autoports/convaiinnovations_laya/demo/index.html').is_file()"
  - "from pathlib import Path; import json; f = json.loads(Path('/opt/tt-metal/models/autoports/convaiinnovations_laya/demo/feed_cases.json').read_text()); assert 40 <= len(f['cases']) <= 100 and f['attribution']['revision']"
  - "from pathlib import Path; import json; assert len(json.loads(Path('/opt/tt-metal/models/autoports/convaiinnovations_laya/demo/presets.json').read_text())) >= 5"
  - "from pathlib import Path; import json; r = json.loads(Path('/opt/tt-metal/models/autoports/convaiinnovations_laya/server/sanity_reference_typed_decisions.json').read_text()); assert r['answers']['routing']['choice'] == 'billing' and abs(r['answers']['routing']['probabilities']['billing'] - 0.6115) < 1e-6"
  - "from pathlib import Path; p = Path('/opt/tt-metal/tt_metal/fabric/impl/kernels/edm_fabric/fabric_erisc_router.cpp'); assert p.is_file() and len(p.read_text()) > 0"
  - "import transformers; assert transformers.__version__.startswith('5.'), transformers.__version__"
  - "import numpy; assert numpy.__version__.startswith('1.'), numpy.__version__"

card:
  description: >
    Laya typed-decisions is the authors' fine-tune of Laya (ModernBERT-large encoder with an option-marker decision
    head, 421M parameters) on the LocalLLaMA/typed-decisions train split, with a 1024-token context and a 256-token
    head budget. One forward pass answers typed noul, choice and score questions with calibrated probabilities; it
    never generates text. This package serves the Jev-compatible /v1/systemone API of the authors' laya-serve on one
    Blackhole p150 chip, with a live demo at /demo/.
  performance: >
    Measured from the packaged image served on one p150 (build 2, image tt-model/laya-typed-decisions-p150:a4c8f7eecc1b,
    whose code sha256 7b36a18faed4998a61c5c6e355eb2bd62cdd9ca9f8ec408bf489b6c30def831b equals this image's: only the
    card changed after it; result files under
    /home/hous/dev/laya/evals/results/package_laya-typed-decisions-p150_p150_b2_20261006T022244Z, release notes in
    doc/release/RUN_NOTES.md). Typed-decisions test set (400 cases, 2,000 decisions, max_len 1024 / head_max_len 256):
    accuracy 0.764, soft accuracy 0.469, Brier 0.062, ECE 0.214, score MAE 0.244 (published 0.766 / 0.471 / 0.062 /
    0.213 / 0.242; CPU fp32 on this host 0.766 / 0.471 / 0.061 / 0.213 / 0.242). Latency per call (client median, warm,
    authors' bench_latency protocol), p150 versus the authors' Tesla T4 for the English checkpoint: 1 question 10.8 ms
    (T4 39.5), 5 questions 24.5 ms (84.5), 10 questions 42.9 ms (158.6), 50 questions 197.6 ms (771); device forward
    9.2 / 22.7 / 40.3 / 191.9 ms. Batched /v1/systemone/batch: 203 to 249 questions per second on one p150 (T4 103 to
    332); the p150x4 profile 309 to 936. Long states that reach the 1024-token bucket (750-token rows, host-served):
    23.9 / 99.0 / 183.2 / 305.6 ms for 1 / 5 / 10 / 16 questions. AG News 0.953 and DAIR Emotion 0.595 accuracy at the
    1024 / 256 budget (the authors publish these suites for the English checkpoint only: 0.950 / 0.595). Parity against
    this checkpoint's CPU fp32 reference on 488 decisions: 383 of 383 confident decisions agree, 485 of 488 argmax agree,
    median max abs delta p 0.004, max 0.040.
  limitations: >
    Fine-tuned for the four typed-decisions workflows (agent trace observability, customer service, invoice
    processing, security incidents); outside them use the base checkpoint. max_len 1024, head_max_len 256; requests
    are padded to 128, 256, 512 or 1024 tokens with 1 to 64 rows at 128 to 512 tokens (exact buckets at 5, 10 and 50
    rows) and 1 to 16 rows at 1024 tokens (a longer 1024-token batch is split into chunks of 16 rows; at most 16384
    padded tokens per forward); longer sequences are refused with 422. Temperatures are clamped to [0.5, 5.0] as pip
    laya 0.3.27 does, so choice questions with more than 10 options use 0.5 instead of the shipped 0.1006.
    action.act_probability carries no usable signal (authors' issue #185); gate on answer_confidence. 13 of 2,000
    typed-decisions reference decisions flip on the device, all with a reference margin under 0.10 (max abs delta p
    0.031); 3 of 488 parity decisions flip, all within margin 0.01 (none of the 383 confident decisions flips). The
    English bundle's served DAIR Emotion run showed single-row deviations against the fp32 reference of up to 0.27 with
    two confident flips (review R3); the corresponding rate is not measured for this checkpoint. One device process
    serializes requests. p150x4 status: served from the packaged sibling image (build 2: healthy in 20 s, 68.5 ms for 50 questions, parity smoke 100 of 100 and 81 of 81 confident). Not reproduced: MASSIVE, XNLI, 45 of 51 languages, post-temperature ECE.
  risks: >
    bf8w_hifi3_erf numerics move probabilities by up to 0.040 (parity corpus, median 0.0039) and 0.031
    (typed-decisions) against the fp32 reference in the packaged run (build 2); the single-row Emotion deviation seen on the
    English bundle is not measured for this checkpoint; gate on confidence, not act_probability. Long option texts are
    truncated to 48 tokens silently, as in the reference. The shipped temperatures are over-confident per the authors;
    refit on your own data.
  usage: |
    Same API as tt-hous/laya-p150: POST /v1/systemone with {"state": ..., "questions": {id: {"type": "choice"|"score"|"noul", "instructions": ..., "criteria": ...}}, "max_len", "head_max_len", "min_confidence"}
    returns {"model", "answers": {id: {...}}, "usage": {input_tokens, output_tokens, state_tokens, state_tokens_dropped, truncated, truncated_questions}}.
    POST /v1/systemone/batch takes {"states": [...], "questions": {...}} (1 to 64 states sharing one question set) and returns {"results": [...], "total_usage": {...}}.
    Use max_len up to 1024 and head_max_len up to 256. GET /v1/health reports backend, precision, mesh, buckets and the
    startup sanity check (compared against server/sanity_reference_typed_decisions.json, selected by LAYA_SANITY_REFERENCE).
    Every /v1 response carries X-Inference-Time-Ms, X-Laya-Device-Ms and X-Laya-Batch. Existing laya and Jev clients work
    by changing the base URL. The demo page is served at /demo/. shim/laya_tt_backend.py installs a TtBackend on a pip
    laya Agent that routes agent.model.forward to this server's /v1/forward (served because LAYA_RAW_FORWARD=1).
  architecture: ModernBERT-large encoder (28 layers, 1024 hidden, GeGLU, dual-theta RoPE, one global attention layer per three) + a 2-layer decision head with an option-marker scorer and an act head
  status: Experimental community bring-up
  intended_use: Calibrated typed decisions for the typed-decisions workflows (agent trace observability, customer service, invoice processing, security incidents).
  out_of_scope_use: Text generation; non-English input; workflows far from the fine-tuning data without evaluation.
  licensing: >
    Laya typed-decisions weights and the vendored rl_common.py, rl_agent_api.py and email_utils.py: Apache-2.0
    (Convai Innovations); ModernBERT-large: Apache-2.0 (Answer.AI); TTNN port and serving code: Apache-2.0
    (Tenstorrent AI ULC); demo feed cases: LocalLLaMA/typed-decisions, Apache-2.0.
  license:
    id: apache-2.0
  pipeline_tag: text-classification
  base_model: [convaiinnovations/laya-typed-decisions, answerdotai/ModernBERT-large]
