  limitations: |
    - With 32 concurrent requests whose generations together exceed the 262144-token pool, vLLM
      preempts a request and the engine exits (`no free device state slot`, plugin allocator). Keep
      concurrent long generations below the pool, for example `--max-num-seqs 16` on p150.
    - Device logprobs exist only on the four-ASIC mesh; on p150 and p150x2 a `logprobs` request is
      rejected with HTTP 400.
    - Host sampling is refused on every profile: `min_p`, `bad_words`, `logit_bias`,
      `allowed_token_ids`, `min_tokens`, structured outputs and `top_logprobs > 0` return HTTP 400.
